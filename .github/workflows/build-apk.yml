name: Build Android APK

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # 配了 RELEASE_KEYSTORE_BASE64 就用正式签名，否则回落到仓库里的 debug key
      - name: Build Release APK
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.jks
            export RELEASE_KEYSTORE_PATH="$PWD/app/release.jks"
            export RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export RELEASE_KEY_ALIAS="$KEY_ALIAS"
            export RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
            echo "使用 secrets 中的正式 keystore 签名"
          else
            echo "未配置 RELEASE_KEYSTORE_BASE64，使用仓库内 debug keystore 签名"
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_PATH" "app/build/outputs/apk/release/pickcode-release.apk"

      - name: Upload APK to fixed release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK
          body: Latest APK built from master.
          files: android/app/build/outputs/apk/release/pickcode-release.apk
          prerelease: true
          make_latest: false
          overwrite_files: true

      - name: Upload APK to tag release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/pickcode-release.apk
